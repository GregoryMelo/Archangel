                                                                ? "bg-orange-100 text-orange-700"
                                                                : "bg-amber-100 text-amber-700"
                                                        }`}>
                                                            {inc.severity}
                                                        </span>
                                                    </div>
                                                    <h3 className="font-bold text-slate-800 text-sm">{inc.title}</h3>
                                                    <p className="text-xs text-slate-600"><strong>Área afetada:</strong> {inc.affectedArea}</p>
                                                    <p className="text-xs text-slate-600"><strong>Regiões vulneráveis:</strong> {inc.vulnerable}</p>
                                                    <div className="grid grid-cols-3 gap-2 text-center bg-white p-2.5 rounded-xl border border-slate-200">
                                                        <div>
                                                            <span className="block font-bold text-slate-800">{inc.viaturas}</span>
                                                            <span className="text-[10px] text-slate-500">Viaturas</span>
                                                        </div>
                                                        <div>
                                                            <span className="block font-bold text-slate-800">{inc.caminhoes}</span>
                                                            <span className="text-[10px] text-slate-500">Caminhões</span>
                                                        </div>
                                                        <div>
                                                            <span className="block font-bold text-slate-800">{inc.bombeiros}</span>
                                                            <span className="text-[10px] text-slate-500">Bombeiros</span>
                                                        </div>
                                                    </div>
                                                    <p className={`text-xs font-semibold ${inc.samu ? "text-red-600" : "text-emerald-700"}`}>
                                                        SAMU: {inc.samuDetail}
                                                    </p>
                                                </div>

                                                <button
                                                    onClick={() => handleDispatch(inc)}
                                                    disabled={inc.dispatched || inc.status === "Controlado"}
                                                    className={`w-full py-2.5 rounded-xl text-xs font-bold transition ${
                                                        inc.dispatched
                                                            ? "bg-amber-600 text-white"
                                                            : inc.status === "Controlado"
                                                            ? "bg-emerald-600 text-white"
                                                            : "bg-red-600 hover:bg-red-700 text-white shadow"
                                                    }`}
                                                >
                                                    {inc.dispatched ? "Recursos Despachados" : inc.status === "Controlado" ? "Concluído" : "Sugerir Despacho Proporcional"}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* ==================== ABA: SENSORES ==================== */}
                            {activeTab === "sensores" && (
                                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="pb-4 border-b border-slate-100 mb-5 flex justify-between items-center">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Telemetria de Sensores Térmicos e Fumaça</h2>
                                            <p className="text-xs text-slate-500">Leituras integradas com as câmeras setoriais do bairro.</p>
                                        </div>
                                        <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-lg">
                                            64/64 Online
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {SENSORS_LIST.map(s => (
                                            <div key={s.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs font-mono font-bold text-slate-500">{s.id}</span>
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                                                        s.status === "Crítico"
                                                            ? "bg-red-100 text-red-700"
                                                            : s.status === "Alto"
                                                            ? "bg-orange-100 text-orange-700"
                                                            : s.status === "Moderado"
                                                            ? "bg-amber-100 text-amber-700"
                                                            : "bg-emerald-100 text-emerald-700"
                                                    }`}>
                                                        {s.status}
                                                    </span>
                                                </div>
                                                <h4 className="font-bold text-slate-800 text-sm">{s.name}</h4>
                                                <div className="flex justify-between text-xs pt-2 border-t border-slate-200 font-mono">
                                                    <span>Temp: <strong>{s.temp}</strong></span>
                                                    <span>Fumaça: <strong>{s.smoke}</strong></span>
                                                    <span className="text-slate-500">{s.cam}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* ==================== ABA: HISTÓRICO ==================== */}
                            {activeTab === "historico" && (
                                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                    <div className="pb-4 border-b border-slate-100 mb-5">
                                        <h2 className="text-lg font-bold text-slate-800">Histórico de Ocorrências Encerradas</h2>
                                        <p className="text-xs text-slate-500">Registro operacional de atendimentos concluídos pela central.</p>
                                    </div>
                                    <div className="space-y-3">
                                        {historyList.map(h => (
                                            <div key={h.id} className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                                                <div>
                                                    <span className="text-xs font-mono font-bold text-slate-500">{h.id} • Encerrado às {h.closedAt}</span>
                                                    <h4 className="font-bold text-slate-800 text-sm">{h.title}</h4>
                                                    <p className="text-xs text-slate-500">{h.location} — {h.outcome}</p>
                                                </div>
                                                <div className="text-right text-xs">
                                                    <span className="block font-semibold text-slate-700">{h.resources}</span>
                                                    <span className="text-emerald-600 font-bold">Duração: {h.duration}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* MODAL DE CÂMERA FIXA AMPLIADA (CAM 02, 03, 04 ou 05) */}
                    {expandedCamId && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl border border-slate-700">
                                <div className="bg-slate-800 px-5 py-3 flex items-center justify-between border-b border-slate-700">
                                    <div className="flex items-center gap-2.5">
                                        <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping" />
                                        <h3 className="text-white font-bold text-sm">
                                            CAM 0{expandedCamId} — Visão Fixa Ampliada
                                        </h3>
                                    </div>
                                    <button
                                        onClick={() => setExpandedCamId(null)}
                                        className="bg-slate-700 hover:bg-slate-600 text-white p-1.5 rounded-lg"
                                    >
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>
                                <div className="relative w-full h-[380px] sm:h-[450px] bg-slate-950">
                                    <canvas ref={expandedCanvasRef} className="w-full h-full block" />
                                    <div className="absolute inset-0 scanline pointer-events-none" />
                                    <div className="absolute bottom-4 left-4 right-4 bg-slate-900/90 border border-slate-700 p-3 rounded-xl flex items-center justify-between text-white text-xs">
                                        <span>Câmera fixa setorial em modo de inspeção ampliada.</span>
                                        <button
                                            onClick={() => setExpandedCamId(null)}
                                            className="bg-red-600 hover:bg-red-700 px-3.5 py-1.5 rounded-lg font-bold"
                                        >
                                            Fechar Ampliação
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
